# Development Configuration for Local Testing
# Run with: mvn spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=dev"

# Server Configuration
server.port=8000

# Database Configuration - H2 In-Memory Database (for development/testing only)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for inspection during development)
spring.h2.console.enabled=true

# Flyway - Disabled for H2 in-memory database
spring.flyway.enabled=false

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.cpt.demo=DEBUG
